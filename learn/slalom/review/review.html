<title>Slalom design system review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* A ruling ledger: sticky progress bar, then items grouped by kind; evidence on the left,
   the decision on the right. Conflicts set Figma and code side by side. */
:root {
  --paper: #f4f5f8; --surface: #ffffff; --ink: #161a22; --muted: #5a6273; --line: #dde1e9;
  --accent: #3346c4; --accent-soft: #e6e9fb; --yes: #1d7a4c; --no: #ad2a22; --open: #8a5a00;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  --data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-control: 6px; --r-panel: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111419; --surface: #191d24; --ink: #e8ebf1; --muted: #9aa2b2; --line: #2b313c;
  --accent: #8d9cff; --accent-soft: #252b4d; --yes: #5fc690; --no: #f08a80; --open: #e0b25a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111419; --surface: #191d24; --ink: #e8ebf1; --muted: #9aa2b2; --line: #2b313c;
  --accent: #8d9cff; --accent-soft: #252b4d; --yes: #5fc690; --no: #f08a80; --open: #e0b25a; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
h1 { font: 600 clamp(20px, 2.4vw, 26px)/1.2 var(--display); margin: 0; text-wrap: balance; flex: 1 1 320px; min-width: 0; }
.progress { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s ease; }
.count { font-variant-numeric: tabular-nums; }
nav.filters { display: flex; gap: 4px; }
nav.filters button { font: 500 14px var(--body); color: var(--muted); background: none; border: 1px solid transparent; border-radius: var(--r-control); padding: 5px 10px; cursor: pointer; }
nav.filters button[aria-pressed="true"] { color: var(--ink); border-color: var(--line); background: var(--paper); }
main { padding-block: 24px 64px; display: grid; gap: 32px; }
.intro { color: var(--muted); max-width: 68ch; margin: 0; }
.notice { border: 1px solid var(--line); border-left: 3px solid var(--open); background: var(--surface); border-radius: var(--r-control); padding: 10px 14px; max-width: 68ch; }
section h2 { font: 600 18px/1.3 var(--display); margin: 0 0 4px; }
section .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.items { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-panel); }
.item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 16px 28px; padding: 16px 18px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item h3 { font: 600 15px/1.35 var(--body); margin: 0 0 6px; overflow-wrap: anywhere; }
.item ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.item li { margin: 2px 0; overflow-wrap: anywhere; }
.suggested { margin-top: 6px; font-size: 13px; color: var(--muted); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 8px; }
.side { border: 1px solid var(--line); border-radius: var(--r-control); padding: 8px 10px; min-width: 0; }
.side b { display: block; font: 600 13px var(--body); margin-bottom: 2px; }
.side div { font-size: 14px; overflow-wrap: anywhere; }
.hex { font: 13px var(--data); white-space: nowrap; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1px solid var(--line);
  background-image: linear-gradient(45deg, var(--line) 25%, transparent 25%, transparent 75%, var(--line) 75%); background-size: 6px 6px; }
.sw i { display: block; width: 100%; height: 100%; border-radius: 2px; }
.decide { display: grid; gap: 8px; align-content: start; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button { font: 500 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-control); padding: 6px 11px; cursor: pointer; }
.opts button:hover:not(:disabled) { border-color: var(--accent); }
.opts button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.opts button.sug::after { content: " (suggested)"; color: var(--muted); font-weight: 400; }
.opts button:disabled { cursor: default; opacity: .6; }
label.f { display: grid; gap: 3px; font-size: 13px; color: var(--muted); }
input.f, textarea.f { font: 14px var(--body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-control); padding: 6px 8px; width: 100%; box-sizing: border-box; }
textarea.f { min-height: 54px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.save { font: 500 13px var(--body); background: none; border: 1px solid var(--line); border-radius: var(--r-control); padding: 4px 10px; color: var(--ink); cursor: pointer; }
.status { font-size: 13px; color: var(--open); }
.status.done { color: var(--yes); }
.status.err { color: var(--no); }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { padding: 16px 18px; color: var(--muted); }
@media (max-width: 760px) { .item { grid-template-columns: minmax(0, 1fr); } .split { grid-template-columns: minmax(0, 1fr); } .bar { width: 90px; } }
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>

<header class="top"><div class="wrap">
  <h1 id="title"></h1>
  <div class="progress"><div class="bar" aria-hidden="true"><span id="bar"></span></div><span class="count" id="count"></span></div>
  <nav class="filters" aria-label="Show">
    <button type="button" data-f="open" aria-pressed="true">Needs a ruling</button>
    <button type="button" data-f="ruled" aria-pressed="false">Ruled</button>
    <button type="button" data-f="all" aria-pressed="false">All</button>
  </nav>
</div></header>

<main class="wrap" id="main">
  <p class="intro" id="intro"></p>
  <p class="notice" id="notice" hidden></p>
  <div id="groups"></div>
</main>

      const shown = all.filter(i => filter === "all" || (filter === "ruled") === isRuled(i));
      const sec = el("section", { "aria-labelledby": "g-" + g.replace(/\W+/g, "-") },
        el("h2", { id: "g-" + g.replace(/\W+/g, "-"), text: `${g} (${all.filter(isRuled).length} of ${all.length} ruled)` }),
        el("p", { class: "sub", text: GROUP_NOTES[g] || "" }));
      const box = el("div", { class: "items" });
      if (!shown.length) box.append(el("div", { class: "empty", text: filter === "open" ? "Every item here has a ruling." : "No rulings here yet." }));
      for (const it of shown) box.append(renderItem(it));
      sec.append(box);
      groups.append(sec);
    }
  }

  function renderItem(it) {
    const r = rulings[it.id] || {};
    const left = el("div", { style: "min-width:0" }, el("h3", {}, withSwatches(it.title)));
    if (it.figma != null) {
      left.append(el("div", { class: "split" },
        el("div", { class: "side" }, el("b", { text: "Figma" }), el("div", {}, withSwatches(it.figma))),
        el("div", { class: "side" }, el("b", { text: "Code" }), el("div", {}, withSwatches(it.code)))));
    }
    const ul = el("ul");
    if (it.name) ul.append(el("li", {}, "Suggested name: ", el("strong", { text: it.name })));
    for (const e of it.evidence || []) ul.append(el("li", {}, withSwatches(e)));
    if (it.examples && it.examples.length) ul.append(el("li", {}, "Example layers: ", el("span", { class: "hex", text: it.examples.join(", ") })));
    left.append(ul);

    const right = el("div", { class: "decide" });
    const opts = el("div", { class: "opts", role: "group", "aria-label": `Ruling for ${it.title}` });
    for (const o of it.options) {
      const b = el("button", { type: "button", "aria-pressed": String(r.decision === o.value) , text: o.label });
      if (it.suggestion === o.value) b.classList.add("sug");
      b.disabled = !canWrite;
      b.addEventListener("click", () => decide(it, o));
      opts.append(b);
    }
    right.append(opts);
    const chosen = it.options.find(o => o.value === r.decision);
    if (chosen && chosen.name) {
      const inp = el("input", { class: "f", id: "name-" + it.id, value: r.name || it.name || "" });
      inp.disabled = !canWrite;
      right.append(el("label", { class: "f", for: "name-" + it.id }, "Name", inp));
    }
    // The note appears once there's a decision to explain.
    if (chosen) {
      const note = el("textarea", { class: "f", id: "note-" + it.id, placeholder: chosen.note ? "What should happen instead?" : "Optional" });
      note.value = r.note || "";
      note.disabled = !canWrite;
      const save = el("button", { type: "button", class: "save", text: chosen.name ? "Save name and note" : "Save note" });
      save.disabled = !canWrite;
      save.addEventListener("click", () => saveExtras(it));
      right.append(el("label", { class: "f", for: "note-" + it.id }, "Note", note), el("div", { class: "row" }, save, statusFor(it, r)));
    } else {
      right.append(statusFor(it, r));
    }
    return el("div", { class: "item", id: "item-" + it.id }, left, right);
  }

  function statusFor(it, r) {
    if (!r.decision) return el("span", { class: "status", text: "Needs a ruling" });
    const who = r.by ? (names[r.by] || "Someone") : "Someone";
    const when = r.at ? new Date(r.at).toLocaleDateString(undefined, { day: "numeric", month: "short" }) : "";
    return el("span", { class: "status done", text: `Ruled by ${who}${when ? ", " + when : ""}` });
  }

  function showError(it, e) {
    const node = $("#item-" + it.id + " .status");
    if (node) { node.className = "status err"; node.textContent = e && e.code === "not_granted" ? "You can view this review but not record rulings." : "Couldn't save. Check your connection and try again."; }
  }

  async function decide(it, o) {
    if (!db || !canWrite) return;
    const prev = rulings[it.id] || {};
    const doc = { decision: o.value, name: o.name ? (prev.name || it.name || null) : null, note: prev.note || null, by: myId, at: new Date().toISOString() };
    rulings[it.id] = doc; render();
    try { await db.doc("rulings/" + it.id).set(doc); } catch (e) { rulings[it.id] = prev; render(); showError(it, e); }
  }

  async function saveExtras(it) {
    if (!db || !canWrite) return;
    const r = rulings[it.id];
    const nameEl = document.getElementById("name-" + it.id);
    const noteEl = document.getElementById("note-" + it.id);
    const patch = { note: noteEl.value.trim() || null, by: myId, at: new Date().toISOString() };
    if (nameEl) patch.name = nameEl.value.trim() || null;
    rulings[it.id] = { ...r, ...patch }; render();
    try { await db.doc("rulings/" + it.id).update(patch); } catch (e) { rulings[it.id] = r; render(); showError(it, e); }
  }

  async function refreshNames() {
    if (!user) return;
    const ids = [...new Set(Object.values(rulings).map(r => r.by).filter(Boolean))];
    if (!ids.length) return;
    try {
      const ps = await user.profiles(ids);
      names = Object.fromEntries(ids.map(id => [id, (ps[id] && ps[id].name) || "Someone"]));
      if (myId) names[myId] = "you";
    } catch (e) { /* names are a nicety */ }
    render();
  }

  document.querySelectorAll("nav.filters button").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.f;
    document.querySelectorAll("nav.filters button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  }));

  render();
  (async () => {
    const notice = $("#notice");
    db = window.claude ? await window.claude.use("db") : null;
    user = window.claude ? await window.claude.use("user") : null;
    if (!db) {
      notice.textContent = "Rulings can't be saved in this view. Open this page on claude.ai while signed in to record them, or use the REVIEW.md checklist that came with it.";
      notice.hidden = false; render(); return;
    }
    myId = user ? await user.id() : null;
    const allowed = user ? await user.can("data.write") : null;
    canWrite = allowed !== false;
    if (!canWrite) { notice.textContent = "You can read this review. To record rulings, ask its owner for edit access."; notice.hidden = false; }
    db.collection("rulings").onSnapshot(snap => {
      for (const d of snap.docs) rulings[d.id] = d.data();
      for (const ch of snap.docChanges()) if (ch.type === "removed") delete rulings[ch.doc.id];
      render(); refreshNames();
    }, () => { notice.textContent = "Couldn't load saved rulings. Reload the page to try again."; notice.hidden = false; });
    render();
  })();
})();
</script>
